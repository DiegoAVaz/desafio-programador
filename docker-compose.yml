services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_ORIGIN: http://backend:3000
    ports:
      - "8080:80"
